<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#f8fafc" />
  <!-- Palette -->
  <rect x="50" y="50" width="200" height="350" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <text x="70" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Components</text>
  <rect x="70" y="100" width="160" height="30" rx="4" fill="#f1f5f9" />
  <text x="80" y="120" font-family="sans-serif" font-size="12" fill="#475569">Text Input</text>
  <rect x="70" y="140" width="160" height="30" rx="4" fill="#f1f5f9" />
  <text x="80" y="160" font-family="sans-serif" font-size="12" fill="#475569">Select Dropdown</text>
  
  <!-- Canvas -->
  <rect x="270" y="50" width="480" height="350" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <text x="290" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Form Builder Canvas</text>
  
  <rect x="290" y="100" width="440" height="70" rx="4" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" />
  <text x="300" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">First Name (Text Input)</text>
  <rect x="300" y="135" width="200" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <circle cx="700" cy="135" r="12" fill="#ef4444" />
  <text x="700" y="139" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">✕</text>
</svg>
