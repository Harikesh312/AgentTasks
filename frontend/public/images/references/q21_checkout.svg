<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#f8fafc" />
  <rect x="200" y="50" width="400" height="350" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  
  <!-- Stepper -->
  <line x1="280" y1="90" x2="520" y2="90" stroke="#e2e8f0" stroke-width="2" />
  <line x1="280" y1="90" x2="400" y2="90" stroke="#3b82f6" stroke-width="2" />
  <circle cx="280" cy="90" r="10" fill="#3b82f6" />
  <text x="280" y="94" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
  <circle cx="400" cy="90" r="10" fill="#3b82f6" />
  <text x="400" y="94" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="520" cy="90" r="10" fill="#e2e8f0" />
  
  <!-- Content -->
  <text x="240" y="140" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Payment Details</text>
  <rect x="240" y="170" width="320" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="250" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">Card Number</text>
  
  <rect x="240" y="230" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="250" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">MM/YY</text>
  
  <rect x="410" y="230" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="420" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">CVC</text>

  <rect x="240" y="320" width="100" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <text x="290" y="345" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">Back</text>
  
  <rect x="460" y="320" width="100" height="40" rx="6" fill="#3b82f6" />
  <text x="510" y="345" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Continue</text>
</svg>
