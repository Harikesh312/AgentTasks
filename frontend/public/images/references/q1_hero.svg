  <!-- Content -->
  <text x="400" y="150" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Build the Future Faster</text>
  <text x="400" y="200" font-family="sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Ship your product in days, not months. The most powerful SaaS boilerplate.</text>
