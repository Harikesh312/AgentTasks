<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#f8fafc" />
  <rect x="50" y="50" width="700" height="350" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <!-- Sticky Header -->
  <rect x="50" y="50" width="680" height="40" fill="#f1f5f9" />
  <text x="70" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">ID</text>
  <text x="150" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">Data Point</text>
  <text x="450" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">Timestamp</text>
  <line x1="50" y1="90" x2="730" y2="90" stroke="#cbd5e1" />
  
  <!-- Virtualized Rows -->
  <text x="70" y="120" font-family="sans-serif" font-size="12" fill="#0f172a">998</text>
  <text x="150" y="120" font-family="sans-serif" font-size="12" fill="#475569">Dataset entry alpha</text>
  <text x="450" y="120" font-family="sans-serif" font-size="12" fill="#475569">2026-08-19</text>
  <line x1="50" y1="135" x2="730" y2="135" stroke="#e2e8f0" />
  
  <text x="70" y="165" font-family="sans-serif" font-size="12" fill="#0f172a">999</text>
  <text x="150" y="165" font-family="sans-serif" font-size="12" fill="#475569">Dataset entry beta</text>
  <text x="450" y="165" font-family="sans-serif" font-size="12" fill="#475569">2026-08-19</text>
  <line x1="50" y1="180" x2="730" y2="180" stroke="#e2e8f0" />
  
  <text x="70" y="210" font-family="sans-serif" font-size="12" fill="#0f172a">1000</text>
  <text x="150" y="210" font-family="sans-serif" font-size="12" fill="#475569">Dataset entry gamma</text>
  <text x="450" y="210" font-family="sans-serif" font-size="12" fill="#475569">2026-08-19</text>
  <line x1="50" y1="225" x2="730" y2="225" stroke="#e2e8f0" />
  
  <!-- Scrollbar -->
  <rect x="730" y="50" width="20" height="350" fill="#f1f5f9" />
  <rect x="734" y="200" width="12" height="40" rx="6" fill="#cbd5e1" />
</svg>
