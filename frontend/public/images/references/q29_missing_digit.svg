<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
    <rect width="800" height="450" fill="#f8fafc" />
    <defs>
      <linearGradient id="grad47" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff9a6c" />
        <stop offset="100%" stop-color="#FF6B35" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    
    <!-- Background element -->
    <rect x="50" y="50" width="700" height="350" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Title -->
    <text x="400" y="120" font-family="sans-serif" font-size="32" font-weight="800" fill="#1e293b" text-anchor="middle">Find the Missing Digit</text>
    <text x="400" y="155" font-family="sans-serif" font-size="18" font-weight="500" fill="#64748b" text-anchor="middle">Array Sequence Challenge</text>
    
    <!-- Array visual -->
    <g transform="translate(100, 220)">
      <!-- 45 -->
      <rect x="0" y="0" width="80" height="80" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
      <text x="40" y="50" font-family="monospace" font-size="32" font-weight="bold" fill="#475569" text-anchor="middle">45</text>
      
      <!-- 46 -->
      <rect x="110" y="0" width="80" height="80" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
      <text x="150" y="50" font-family="monospace" font-size="32" font-weight="bold" fill="#475569" text-anchor="middle">46</text>
      
      <!-- The Missing 47! -->
      <rect x="220" y="0" width="160" height="80" rx="16" fill="url(#grad47)" opacity="0.1" stroke="#FF6B35" stroke-width="3" stroke-dasharray="8 8" />
      <text x="300" y="52" font-family="monospace" font-size="42" font-weight="900" fill="#FF6B35" text-anchor="middle" filter="url(#glow)">47</text>
      
      <!-- 48 -->
      <rect x="410" y="0" width="80" height="80" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
      <text x="450" y="50" font-family="monospace" font-size="32" font-weight="bold" fill="#475569" text-anchor="middle">48</text>
      
      <!-- 49 -->
      <rect x="520" y="0" width="80" height="80" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
      <text x="560" y="50" font-family="monospace" font-size="32" font-weight="bold" fill="#475569" text-anchor="middle">49</text>
    </g>

    <!-- Decorative path -->
    <path d="M 250 380 Q 400 320 550 380" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-dasharray="6 6" />
    <circle cx="250" cy="380" r="6" fill="#FF6B35" opacity="0.6" />
    <circle cx="550" cy="380" r="6" fill="#FF6B35" opacity="0.6" />
</svg>