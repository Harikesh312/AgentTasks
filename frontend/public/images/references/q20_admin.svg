<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#f8fafc" />
  <rect x="50" y="50" width="700" height="350" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <rect x="70" y="70" width="200" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="80" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">Search users...</text>
  <rect x="290" y="70" width="100" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
