  <text x="600" y="190" font-family="sans-serif" font-size="12" fill="#475569">Admin</text>
  
  <line x1="50" y1="210" x2="750" y2="210" stroke="#e2e8f0" />
  <text x="70" y="240" font-family="sans-serif" font-size="12" fill="#0f172a">Bob Jones</text>
