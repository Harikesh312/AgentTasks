  <text x="600" y="240" font-family="sans-serif" font-size="12" fill="#475569">User</text>
  
  <line x1="50" y1="360" x2="750" y2="360" stroke="#e2e8f0" />
  <text x="70" y="385" font-family="sans-serif" font-size="12" fill="#64748b">Showing 1-10 of 42</text>
