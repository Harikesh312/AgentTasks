  <text x="600" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">Role</text>
  
  <line x1="50" y1="160" x2="750" y2="160" stroke="#e2e8f0" />
  <text x="70" y="190" font-family="sans-serif" font-size="12" fill="#0f172a">Alice Smith</text>
  <text x="250" y="190" font-family="sans-serif" font-size="12" fill="#475569">alice@example.com</text>
